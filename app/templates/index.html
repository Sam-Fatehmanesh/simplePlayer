<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RickettsRadio - Web Music Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <nav class="sidebar">
            <div class="logo">
                <i class="fas fa-headphones-alt"></i>
                <h1>RickettsRadio</h1>
            </div>
            <ul>
                <li><a href="#"><i class="fas fa-home"></i> Home</a></li> 
                <li><a href="#"><i class="fas fa-search"></i> Search</a></li>
                <li><a href="#"><i class="fas fa-stream"></i> Queue</a></li>
            </ul>
        </nav>

        <div class="main-content">
            <header class="main-header">
                <div class="search-box">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="search-input" placeholder="What do you want to listen to?" v-model="searchQuery" @keyup.enter="searchMusic">
                </div>
            </header>

            <main class="content-area">
                <div class="search-results-section" v-if="searchResults.length > 0">
                    <h2>Search Results</h2>
                    <div class="results-list">
                        <div class="list-item" v-for="(result, index) in searchResults" :key="index">
                            <div class="list-item-details">
                                <h3>{{ result.title }}</h3>
                            </div>
                            <div class="list-item-actions">
                                <button class="icon-button add-button" @click="addToQueue(result)" title="Add to Queue">
                                    <i class="fas fa-plus"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="queue-section">
                    <div class="queue-header">
                        <h2>Queue</h2>
                        <button class="text-button clear-queue" @click="clearQueue" v-if="queue.length > 0">
                            Clear Queue
                        </button>
                    </div>
                    
                    <div class="empty-queue" v-if="queue.length === 0">
                        <i class="fas fa-list-ul"></i>
                        <p>Your queue is empty.</p>
                        <p>Search for music to add.</p>
                    </div>
                    
                    <div class="queue-list" v-else>
                        <div class="list-item queue-list-item" v-for="(track, index) in queue" :key="track.id || index" :class="{ 'now-playing': index === 0 && isPlaying }">
                            <div class="queue-number">{{ index + 1 }}</div>
                            <div class="queue-thumbnail-placeholder" v-if="index === 0 && isPlaying">
                                <i class="fas fa-volume-up"></i>
                            </div>
                            <div class="queue-thumbnail-placeholder" v-else>
                                <i class="fas fa-music"></i>
                            </div>
                            <div class="list-item-details">
                                <h3>{{ track.title }}</h3>
                            </div>
                            <div class="list-item-actions">
                                <button class="icon-button remove-button" @click="removeFromQueue(index)" title="Remove from Queue">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <footer class="player-controls">
            <div class="now-playing-info">
                <div v-if="!currentTrack" class="track-placeholder">Select a song to play</div>
                <div v-if="currentTrack" class="track-details">
                    <div class="track-text">
                        <span class="track-title">{{ currentTrack.title }}</span>
                    </div>
                </div>
            </div>
            
            <div class="player-center-controls">
                <button class="icon-button control-button" @click="stopPlayback" title="Stop">
                    <i class="fas fa-stop"></i>
                </button>
                <button class="icon-button control-button play-pause" @click="togglePlayPause" :title="isPlaying ? 'Pause' : 'Play'">
                    <i :class="isPlaying ? 'fas fa-pause' : 'fas fa-play'"></i>
                </button>
            </div>
            
            <div class="player-right-controls">
                <div class="volume-control">
                    <i class="fas fa-volume-down"></i>
                    <input type="range" min="0" max="100" v-model="currentVolume" @input="setVolume" title="Volume">
                    <i class="fas fa-volume-up"></i>
                </div>
            </div>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicFun - Web Music Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <header>
            <div class="logo">
                <i class="fas fa-music"></i>
                <h1>MusicFun</h1>
            </div>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search for music..." v-model="searchQuery" @keyup.enter="searchMusic">
                <button id="search-button" @click="searchMusic">
                    <i class="fas fa-search"></i>
                </button>
            </div>
        </header>

        <main>
            <div class="container">
                <div class="music-section">
                    <div class="search-results" v-if="searchResults.length > 0">
                        <h2>Search Results</h2>
                        <div class="results-container">
                            <div class="music-card" v-for="(result, index) in searchResults" :key="index">
                                <div class="thumbnail">
                                    <img :src="result.thumbnail || '/static/images/default-thumbnail.jpg'" :alt="result.title">
                                </div>
                                <div class="details">
                                    <h3>{{ result.title }}</h3>
                                </div>
                                <div class="actions">
                                    <button class="add-button" @click="addToQueue(result)">
                                        <i class="fas fa-plus"></i> Add to Queue
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="queue-section">
                        <div class="queue-header">
                            <h2>Current Queue</h2>
                            <button class="clear-queue" @click="clearQueue" v-if="queue.length > 0">
                                <i class="fas fa-trash"></i> Clear Queue
                            </button>
                        </div>
                        
                        <div class="empty-queue" v-if="queue.length === 0">
                            <i class="fas fa-music"></i>
                            <p>Queue is empty. Search for music to add to your queue.</p>
                        </div>
                        
                        <div class="queue-container" v-else>
                            <div class="queue-item" v-for="(track, index) in queue" :key="index" :class="{ 'now-playing': index === 0 && isPlaying }">
                                <div class="queue-number">{{ index + 1 }}</div>
                                <div class="queue-thumbnail">
                                    <img :src="track.thumbnail || '/static/images/default-thumbnail.jpg'" :alt="track.title">
                                    <div class="now-playing-indicator" v-if="index === 0 && isPlaying">
                                        <i class="fas fa-volume-up"></i>
                                    </div>
                                </div>
                                <div class="queue-details">
                                    <h3>{{ track.title }}</h3>
                                </div>
                                <div class="queue-actions">
                                    <button class="remove-button" @click="removeFromQueue(index)">
                                        <i class="fas fa-times"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="player-controls" v-if="currentTrack">
            <div class="now-playing-info">
                <div class="now-playing-thumbnail">
                    <img :src="currentTrack.thumbnail || '/static/images/default-thumbnail.jpg'" :alt="currentTrack.title">
                </div>
                <div class="now-playing-details">
                    <h3>{{ currentTrack.title }}</h3>
                </div>
            </div>
            
            <div class="controls">
                <button class="control-button" @click="stopPlayback">
                    <i class="fas fa-stop"></i>
                </button>
                <button class="control-button play-pause" @click="togglePlayPause">
                    <i :class="isPlaying ? 'fas fa-pause' : 'fas fa-play'"></i>
                </button>
            </div>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
